# Path B structural/policy tests (no Darkwood GameDir). Full mod DLL stays local-only.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  path-b-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Path B tests
        run: dotnet test DarkwoodMP.PathB.Tests/DarkwoodMP.PathB.Tests.csproj -c Release --verbosity minimal
